name: Release Multiplatform Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  release-tauri:
    name: Build & Release (${{ matrix.platform }} - ${{ matrix.arch }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
            arch: 'macos-arm64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
            arch: 'macos-x64'
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            target: 'x86_64-pc-windows-msvc'
            arch: 'windows-x64'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure Apple Developer Signing (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}" >> $GITHUB_ENV
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> $GITHUB_ENV
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> $GITHUB_ENV
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV
            echo "Apple Developer signing configured from repository secrets."
          else
            echo "No Apple Developer certificate found in repository secrets. Using ad-hoc signing."
          fi

      - name: Build Desktop Application with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Nilkanth Medico HOMS Child v__VERSION__'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Ensure macOS DMG Package Exists
        if: runner.os == 'macOS'
        shell: bash
        run: |
          DMG_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          EXISTING_DMG=$(find "$DMG_DIR" -name "*.dmg" 2>/dev/null | head -n 1)
          if [ -z "$EXISTING_DMG" ]; then
            APP_PATH=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -name "*.app" -maxdepth 1 2>/dev/null | head -n 1)
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              DMG_OUTPUT="$DMG_DIR/Nilkanth-Medico-HOMS-Child-${{ matrix.arch }}.dmg"
              echo "Packaging $APP_PATH into DMG: $DMG_OUTPUT"
              hdiutil create -volname "Nilkanth Medico HOMS Child" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_OUTPUT"
            else
              echo "Warning: No .app bundle found to create DMG from."
            fi
          else
            echo "Tauri generated DMG found at: $EXISTING_DMG"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nilkanth-Medico-HOMS-Child-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: warn
