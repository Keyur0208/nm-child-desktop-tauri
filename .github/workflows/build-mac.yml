name: Build macOS Application

on:
  workflow_dispatch:
    inputs:
      release_draft:
        description: 'Create a GitHub Release draft'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64-apple-silicon
          - target: x86_64-apple-darwin
            arch: x64-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure Apple Developer Signing (if secrets exist)
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}" >> $GITHUB_ENV
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> $GITHUB_ENV
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> $GITHUB_ENV
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV
            echo "Apple Developer signing configured from repository secrets."
          else
            echo "No Apple Developer certificate found in repository secrets. Using ad-hoc signing."
          fi

      - name: Build macOS Application with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Nilkanth Medico HOMS Child v__VERSION__'
          releaseDraft: ${{ github.event.inputs.release_draft || false }}
          prerelease: false

      - name: Ensure macOS DMG Package Exists
        run: |
          DMG_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          EXISTING_DMG=$(find "$DMG_DIR" -name "*.dmg" 2>/dev/null | head -n 1)
          if [ -z "$EXISTING_DMG" ]; then
            APP_PATH=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -name "*.app" -maxdepth 1 2>/dev/null | head -n 1)
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              DMG_OUTPUT="$DMG_DIR/Nilkanth-Medico-HOMS-Child-${{ matrix.arch }}.dmg"
              echo "Packaging $APP_PATH into DMG: $DMG_OUTPUT"
              hdiutil create -volname "Nilkanth Medico HOMS Child" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_OUTPUT"
            else
              echo "Warning: No .app bundle found to create DMG from."
            fi
          else
            echo "Tauri generated DMG found at: $EXISTING_DMG"
          fi

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nilkanth-Medico-HOMS-Child-${{ matrix.arch }}-DMG
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload macOS App Bundle Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nilkanth-Medico-HOMS-Child-${{ matrix.arch }}-App
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: warn
