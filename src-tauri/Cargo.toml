[package]
name = "nilkanth-medico-homs-child"
version = "0.0.1"
description = "Nilkanth Medico HOMS Child Desktop Application"
authors = ["Nilkanth Medico PVT LTD"]
edition = "2021"
default-run = "nilkanth-medico-homs-child"

[lib]
name = "nilkanth_medico_homs_child_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
whoami = "1.5"
sysinfo = "0.32"
mac_address = "1.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_System",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
] }

[profile.dev]
codegen-units = 1
incremental = false

[profile.dev.build-override]
codegen-units = 1
incremental = false

[profile.release]
opt-level = 3
codegen-units = 1
incremental = false
lto = "thin"
panic = "abort"
strip = true

[profile.release.build-override]
opt-level = 3
codegen-units = 1
incremental = false




