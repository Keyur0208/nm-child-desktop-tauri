<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self' 'unsafe-inline' 'unsafe-eval' http: https: data: blob:; connect-src 'self' http: https: ws: wss:;"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nilkanth Medico - HOMS Child</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family:
                    'Segoe UI',
                    system-ui,
                    -apple-system,
                    sans-serif;
                background: linear-gradient(135deg, #f0f4ff 0%, #e8f5e9 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #1e293b;
                overflow: hidden;
            }

            #app {
                width: 100%;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .card {
                background: #ffffff;
                border-radius: 20px;
                box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
                padding: 48px 56px;
                text-align: center;
                max-width: 520px;
                width: 92%;
                animation: fadeIn 0.3s ease-out;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .icon-wrap {
                width: 80px;
                height: 80px;
                margin: 0 auto 24px;
                background: #fee2e2;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .icon-wrap svg {
                width: 40px;
                height: 40px;
                stroke: #ef4444;
            }

            .icon-wrap.connecting {
                background: #eff6ff;
            }

            .icon-wrap.connecting svg {
                stroke: #2563eb;
                animation: spin 1.5s linear infinite;
            }

            @keyframes spin {
                100% {
                    transform: rotate(360deg);
                }
            }

            h1 {
                font-size: 22px;
                font-weight: 700;
                color: #0f172a;
                margin-bottom: 12px;
                letter-spacing: -0.3px;
            }

            .subtitle {
                font-size: 14px;
                color: #64748b;
                line-height: 1.6;
                margin-bottom: 24px;
            }

            .status-pill {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                background: #fef2f2;
                border: 1px solid #fecaca;
                color: #b91c1c;
                font-size: 13px;
                font-weight: 500;
                padding: 6px 16px;
                border-radius: 99px;
                margin-bottom: 24px;
            }

            .status-pill.connecting {
                background: #eff6ff;
                border-color: #bfdbfe;
                color: #1d4ed8;
            }

            .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #ef4444;
                animation: blink 1.4s ease-in-out infinite;
            }

            .dot.blue {
                background: #2563eb;
            }

            @keyframes blink {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.2;
                }
            }

            .btn-retry {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 12px 28px;
                background: #2563eb;
                color: #fff;
                border: none;
                border-radius: 10px;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition:
                    background 0.18s,
                    transform 0.1s;
                user-select: none;
            }

            .btn-retry:hover {
                background: #1d4ed8;
            }

            .btn-retry:active {
                transform: scale(0.97);
            }

            .countdown {
                margin-top: 16px;
                font-size: 13px;
                color: #94a3b8;
            }

            .countdown strong {
                color: #475569;
                font-weight: 600;
            }

            .divider {
                border: none;
                border-top: 1px solid #f1f5f9;
                margin: 28px 0 16px;
            }

            .brand {
                font-size: 11px;
                color: #94a3b8;
                letter-spacing: 0.4px;
                text-transform: uppercase;
            }

            .brand span {
                color: #cbd5e1;
                margin: 0 6px;
            }

            #erp-frame {
                width: 100vw;
                height: 100vh;
                border: none;
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="app">
            <div id="status-card" class="card">
                <div id="icon-container" class="icon-wrap connecting">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 6v6l4 2"></path>
                    </svg>
                </div>

                <h1 id="status-title">Connecting to Hospital ERP…</h1>
                <p id="status-subtitle" class="subtitle">
                    Establishing connection to Nilkanth Medico ERP server at <code id="server-url"></code>
                </p>

                <div id="status-pill" class="status-pill connecting">
                    <span id="status-dot" class="dot blue"></span>
                    <span id="status-text">Connecting…</span>
                </div>

                <div>
                    <button id="btn-retry" class="btn-retry" style="display: none;">
                        Retry Now
                    </button>
                </div>

                <div id="countdown" class="countdown" style="display: none;">
                    Retrying connection in <strong id="timer-val">5</strong>s…
                </div>

                <hr class="divider" />

                <p class="brand">
                    Nilkanth Medico Private Limited
                    <span>·</span>
                    Hospital ERP System (Child Terminal)
                </p>
            </div>

            <iframe id="erp-frame"></iframe>
        </div>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
